{% extends "catalogo/base.html" %}
{% block titulo %}Eliminar producto{% endblock %}
{% block contenido %}
<div class="auth-page">
    <div class="auth-card admin-form-card">
        <span class="kicker">Inventario</span>
        <h2>Confirmar Eliminación</h2>
        <p>¿Estás seguro de que deseas eliminar el producto <strong>{{ producto.nombre }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'catalogo:lista_productos' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
